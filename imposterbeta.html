<style>

<div id="app"></div>

const set=p=>{fg.style.strokeDashoffset=C*(1-p);b.style.setProperty("--p",p)};
const end=()=>{cancelAnimationFrame(raf);raf=0;pid=null;b.classList.remove("holding")};
const cancel=()=>{if(pid==null)return;end();fg.style.transition="stroke-dashoffset .18s";set(0);setTimeout(()=>{fg.style.transition=""},220);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");snd("soon");hm.textContent="Too soon! Keep holding the full second.";};
const fire=()=>{if(G.revealed)return;G.revealed=true;end();buzz(45);snd("reveal");go("role")};
const tick=()=>{const p=Math.min(1,(performance.now()-t0)/1000);set(p);if(p>=1)fire();else raf=requestAnimationFrame(tick)};
const begin=id=>{if(pid!=null||G.revealed)return;pid=id;t0=performance.now();fg.style.transition="";b.classList.remove("shake");b.classList.add("holding");hm.textContent="Scanning… keep holding";snd("hold");buzz(12);raf=requestAnimationFrame(tick)};
b.addEventListener("pointerdown",e=>{if(e.pointerType=="mouse"&&e.button!==0)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}begin(e.pointerId)});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,e=>{if(pid!=null&&e.pointerId==pid)cancel()}));
b.addEventListener("pointermove",e=>{if(pid==null||e.pointerId!=pid)return;const r=b.getBoundingClientRect(),m=40;if(e.clientX<r.left-m||e.clientX>r.right+m||e.clientY<r.top-m||e.clientY>r.bottom+m)cancel()});
["contextmenu","selectstart","dragstart"].forEach(ev=>b.addEventListener(ev,e=>e.preventDefault()));
b.addEventListener("keydown",e=>{if((e.key==" "||e.key=="Enter")&&!e.repeat){e.preventDefault();begin("k")}});
b.addEventListener("keyup",e=>{if((e.key==" "||e.key=="Enter")&&pid=="k")cancel()});
b.addEventListener("blur",()=>{if(pid!=null)cancel()});
};

V.role=()=>{const imp=G.i==G.imp;return `<div class="paper role ${imp?"imp":""}">`+(imp?`<span class="stamp">Classified</span><h2 class="disp" style="font-size:2.3rem">You are the imposter 🕵️</h2>${S.hints&&G.hint?`<p class="hintline">Your clue:<b>${esc(G.hint)}</b></p>`:`<p>No clue this round. Listen closely and blend in.</p>`}<p style="opacity:.85">You don't know the secret word. Bluff like a pro.</p>`:`<span class="lab">Secret word</span><div class="word disp" style="${wsz(G.w)}">${esc(G.w)}</div><span class="stamp sm">Eyes only</span><p>Memorize it. Show no one.</p>`)+`</div><div class="grow"></div><button class="btn big" data-a="hide">Hide &amp; pass the file</button>`};

V.ready=()=>`<div class="mid"><div style="font-size:4.5rem">🤫</div><h2 class="disp h">All suspects briefed.</h2><p>${nm(G.start)} gives the first clue, then go around the circle.</p><p class="micro">${pick(JOKES)}</p></div><button class="btn big" data-a="disc">Start interrogation</button>`;

V.disc=()=>{const d=G.done;return `${bar("Interrogation")}<h2 class="disp center h">${d?"Time's up!":"Interrogation in progress"}</h2>`+(S.timer?`<div class="clock disp ${d?"low":""}" id="tm">${fmt(d?0:G.left)}</div><div class="bar"><i id="bi" style="width:${d?0:G.left/S.timer*100}%"></i></div>`:`<div class="mid" style="font-size:4.5rem">💬</div>`)+`<p class="center" style="color:var(--mut)">${nm(G.start)} starts. One clue each, nothing too obvious. When everyone has guessed out loud, reveal the truth.</p><div class="grow"></div><button class="btn ${S.timer&&!d?"alt":"big"}" data-a="reveal">🔍 Reveal imposter</button>`};
POST.disc=()=>{if(!S.timer||G.done)return;tm=setInterval(()=>{const ms=G.end-Date.now(),l=Math.max(0,Math.ceil(ms/1000)),t=document.getElementById("tm"),b=document.getElementById("bi");if(!t)return;
G.left=l;t.textContent=fmt(l);b.style.width=Math.max(0,ms/(S.timer*10))+"%";
if(l!=G.ls){G.ls=l;if(l<=10&&l>0){t.classList.add("low");snd("warn")}}
if(l<=0){G.done=true;snd("result");go("disc",1)}},250)};

V.suspense=()=>`<div class="mid scan"><div class="lens">🔍</div><h2 class="disp h">Analyzing evidence</h2><div class="ld"><i style="animation-duration:${RM?.2:2.4}s"></i></div><p class="lab" id="sm">Dusting for fingerprints…</p></div>`;
POST.suspense=()=>{const T=RM?[0,300]:[0,800,1600,2400],M=["Dusting for fingerprints…","Cross-checking alibis…","Something doesn't add up…"];
M.forEach((m,i)=>tms.push(setTimeout(()=>{const e=document.getElementById("sm");if(e&&!RM)e.textContent=m;snd("click");buzz(10)},T[i]||0)));tms.push(setTimeout(()=>go("result"),T[T.length-1]))};

V.result=()=>{const im=S.players[G.imp];
return `<div class="res"><p class="lab rv" style="--d:.1s">Suspect identified</p><div class="paper dos rv" style="--d:.4s">${avb(im,"xl")}<div class="nm">${esc(im.n)}</div><span class="stamp sm">The imposter</span></div>
<p class="lab rv" style="--d:.9s">The secret word was</p><div class="word disp rv wcard" style="--d:1.1s;${wsz(G.w)}">${esc(G.w)}</div>
${S.hints&&G.hint?`<p class="micro rv" style="--d:1.3s;align-self:center">${nm(G.imp)}'s clue was “${esc(G.hint)}”.</p>`:""}
<div class="stampbig disp" style="--d:1.6s">Case closed</div>
<div class="stack rv" style="--d:2.1s"><button class="btn big" data-a="again">Open a new case</button><button class="btn alt" data-a="go" data-v="home">Back to HQ</button></div></div>`};
POST.result=()=>{tms.push(setTimeout(()=>{snd("reveal");buzz(30)},400),setTimeout(()=>snd("result"),1100),setTimeout(()=>{snd("stamp");buzz([30,40,60])},1650))};

const tog=(k,t,d)=>`<div class="opt"><div><b>${t}</b><small>${d}</small></div><button class="tog ${S[k]?"on":""}" role="switch" aria-checked="${!!S[k]}" aria-label="${t}" data-a="tog" data-v="${k}"><i></i></button></div>`;
V.settings=()=>`<div class="top"><button class="pill" data-a="back">‹ Back</button></div><h2 class="disp h">Settings</h2>
<div class="card"><h3>Theme</h3><div class="themes">${THEMES.map(([k,n,c])=>`<button class="sw ${S.theme==k?"on":""}" data-a="theme" data-v="${k}" aria-pressed="${S.theme==k}"><i style="background:${c}"></i>${n}</button>`).join("")}</div></div>
<div class="card">${tog("hints","Hints","The imposter gets a subtle one-word clue")}${tog("sound","Sound effects","Clicks, scans and case-closed stamps")}</div>
<div class="card"><h3 style="margin-bottom:10px">Interrogation timer</h3><div class="chips">${[30,60,90,120,0].map(t=>`<button class="chip ${S.timer==t?"on":""}" data-a="timer" data-v="${t}" aria-pressed="${S.timer==t}">${t?t+" seconds":"No timer"}</button>`).join("")}</div></div>
<button class="btn alt" data-a="go" data-v="how">How to play</button><button class="btn alt" data-a="reset">Reset settings</button>`;

V.how=()=>`<div class="top"><button class="pill" data-a="back">‹ Back</button></div><h2 class="disp h">How to play</h2>
<ol class="steps">${[["Get your secret role","Pass the phone around. Press and hold the fingerprint for 1 second to see your word. Everyone gets the same word except the imposter."],["Give clues","Take turns saying one clue about the word. Be vague enough to fool the imposter, clear enough for your team."],["Interrogate","Talk it out. Who sounds like they're guessing?"],["Make your guesses","Everyone says out loud who they think the imposter is."],["Reveal the imposter","Tap Reveal imposter to expose the suspect and the secret word. Case closed!"]].map(([t,d],i)=>`<li class="card"><span class="num">${i+1}</span><div><h3>${t}</h3><p style="color:var(--mut)">${d}</p></div></li>`).join("")}</ol>
<div class="card"><b>If hints are on:</b> the imposter gets one subtle clue word, a side-door connection to the secret word.</div>`;

/* actions */
ACT.go=v=>{if(v=="settings"||v=="how")st.push(scr);else st=[];go(v)};
ACT.back=()=>go(st.pop()||"home");
ACT.av=i=>{const p=S.players[i],u=new Set(S.players.map(x=>x.a)),k=AV.indexOf(p.a);for(let j=1;j<=AV.length;j++){const c=AV[(k+j)%AV.length];if(!u.has(c)){p.a=c;break}}save();go("setup",1)};
ACT.add=()=>{if(S.players.length>=16)return;const u=new Set(S.players.map(x=>x.a));S.players.push({n:"Player "+(S.players.length+1),a:shuf(AV.filter(x=>!u.has(x)))[0]});save();go("setup",1);const q=document.querySelectorAll(".prow input"),l=q[q.length-1];l.focus();l.select()};
ACT.rm=i=>{if(S.players.length>3){S.players.splice(+i,1);save();go("setup",1)}};
ACT.all=()=>{S.cats.size==BANK.length?S.cats.clear():BANK.forEach((_,i)=>S.cats.add(i));save();go("setup",1)};
ACT.cat=i=>{i=+i;S.cats.has(i)?S.cats.delete(i):S.cats.add(i);save();go("setup",1)};
ACT.start=()=>{if(!S.cats.size||S.players.length<3)return;S.players.forEach((p,i)=>{p.n=p.n.trim()||"Player "+(i+1)});save();
const pool=[...S.cats].flatMap(i=>BANK[i].w.map(x=>({...x,c:BANK[i].n})));
let f=pool.filter(x=>!used.has(x.w)&&x.w!==last);if(!f.length){used.clear();f=pool.filter(x=>x.w!==last)}if(!f.length)f=pool;
const x=pick(f);used.add(x.w);last=x.w;const v=x.h.filter(h=>okHint(h,x.w,x.c));
G={w:x.w,hint:v.length?pick(v):null,imp:rnd(S.players.length),start:rnd(S.players.length),i:0,revealed:false,no:"IK-"+(1000+rnd(9000)),joke:pick(JOKES)};snd("open");go("open");return 0};
ACT.again=()=>ACT.start();
ACT.skip=()=>go("pass");
ACT.hide=()=>{G.i++;G.revealed=false;go(G.i>=S.players.length?"ready":"pass")};
ACT.disc=()=>{G.done=false;G.left=S.timer;G.end=Date.now()+S.timer*1000;G.ls=-1;snd("open");go("disc");return 0};
ACT.reveal=()=>{if(scr!="disc")return 0;snd("drum");buzz([20,60,20]);go("suspense");return 0};
ACT.quit=(v,t)=>{if(t.dataset.arm){go("home")}else{t.dataset.arm=1;t.textContent="Tap again to quit";setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent="✕ Quit"}},2500)}};
ACT.theme=v=>{S.theme=v;applyTheme();save();go("settings",1)};
ACT.tog=k=>{S[k]=!S[k];save();go("settings",1)};
ACT.timer=v=>{S.timer=+v;save();go("settings",1)};
ACT.reset=()=>{S.theme="dark";S.hints=true;S.sound=true;S.timer=60;applyTheme();save();go("settings",1)};

app.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(!f)return;if(f(t.dataset.v,t)!==0)snd("click")});
app.addEventListener("input",e=>{const n=e.target.dataset.n;if(n!=null&&S.players[n]){S.players[n].n=e.target.value;save()}});
go("home");
</script>
</body>
</html>
