<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imposter Koho?</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3dc;--card:#fff;--ink:#1d1a2b;--line:#1d1a2b;--a:#ff4d6d;--b:#ffc93c;--c:#20bfa9;--onA:#1d1a2b;--fd:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#16131f;--card:#262135;--ink:#f6f1ff;--line:#07050c;--a:#ff5d8f;--b:#ffd23f;--c:#35e0c2;--onA:#16131f}
[data-theme=pink]{--bg:#ffd3e6;--card:#fff0f7;--ink:#3b0f2c;--line:#3b0f2c;--a:#e5007d;--b:#ffb703;--c:#7b2cbf;--onA:#fff}
[data-theme=yellow]{--bg:#ffe45e;--card:#fffbe3;--ink:#2a2200;--line:#2a2200;--a:#ff6a3d;--b:#35c4b0;--c:#7b3fc4;--onA:#2a2200}
[data-theme=purple]{--bg:#4b2391;--card:#63389f;--ink:#fff;--line:#1c0a3d;--a:#ffd23f;--b:#ff7ab8;--c:#5ef2d0;--onA:#1c0a3d}
[data-theme=blue]{--bg:#cde6ff;--card:#f4faff;--ink:#0b2545;--line:#0b2545;--a:#1f6bff;--b:#ffd23f;--c:#ff6b6b;--onA:#fff}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:600 17px/1.4 Figtree,"Segoe UI",system-ui,sans-serif;transition:background .3s,color .3s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
h2,h3,p{margin:0}
#app{flex:1;width:100%;max-width:560px;margin:0 auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px}
#app.anim>*{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes pulse{to{transform:scale(1.07)}}
.disp{font-family:var(--fd);font-weight:400;line-height:1.05}
.center{text-align:center}.grow{flex:1}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1;text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:20px 0}
.title{font-size:clamp(3.2rem,16vw,5.6rem);margin:0;transform:rotate(-3deg);text-shadow:4px 4px 0 var(--a)}
.sub{font-size:1.25rem}
.faces{display:flex;gap:8px}.faces .av{animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.28s)}
.av{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:3px solid var(--line);font-size:28px;line-height:1;flex:none;padding:0;color:#000}
.av.sm{width:40px;height:40px;font-size:22px}.av.lg{width:84px;height:84px;font-size:46px}.av.xl{width:128px;height:128px;font-size:70px}
.btn{display:block;width:100%;min-height:58px;padding:12px 20px;border:3px solid var(--line);border-radius:20px;background:var(--a);color:var(--onA);font:400 1.35rem var(--fd);box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}.btn.big{min-height:70px;font-size:1.6rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.holdbtn{position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.holdbtn:after{content:"";position:absolute;inset:0 auto 0 0;width:var(--hold-progress,0%);background:var(--c);opacity:.45;pointer-events:none;transition:width .08s linear}
.holdbtn span{position:relative;z-index:1}
.holdnote{font-size:.9rem;opacity:.8;text-align:center;margin-top:-4px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:800;min-height:44px}
.pill.dim{background:transparent;border-color:transparent;opacity:.8;cursor:default}
.lab{font-weight:800;letter-spacing:.04em}
.name{font-size:2.4rem}
.word{font-size:clamp(2.3rem,13vw,3.6rem);text-transform:uppercase;overflow-wrap:anywhere;margin:6px 0}
.role{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.role.imp{background:var(--a);color:var(--onA)}
.hintline{font-size:1.4rem}.hintline b{display:block;font:400 2.6rem var(--fd);margin-top:4px}
.prow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.prow input{flex:1;min-width:0;font:700 1.1rem Figtree,system-ui,sans-serif;padding:12px 14px;border:3px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);min-height:52px}
.ic{width:44px;height:44px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:900;flex:none}.ic:disabled{opacity:.3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 14px;font-weight:800;min-height:44px}
.chip.on{background:var(--b);color:var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.note{text-align:center;font-size:.95rem}.link{background:none;border:0;text-decoration:underline;font-weight:800;padding:6px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:10px 4px;font-weight:800}
.sw i{width:34px;height:34px;border-radius:50%;border:3px solid var(--line)}.sw.on{background:var(--b);color:var(--line)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}.opt small{display:block;opacity:.75;font-weight:500}
.opt+.opt{border-top:2px dashed var(--line);margin-top:6px;padding-top:12px}
.tog{width:64px;height:36px;border-radius:99px;border:3px solid var(--line);background:var(--bg);position:relative;padding:0;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}.tog.on{background:var(--c)}.tog.on i{transform:translateX(28px)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:14px;align-items:flex-start}
.num{width:40px;height:40px;flex:none;border-radius:50%;background:var(--a);color:var(--onA);border:3px solid var(--line);display:grid;place-items:center;font:400 1.2rem var(--fd)}
.clock{font-size:clamp(5rem,30vw,9rem);text-align:center}.clock.low{color:var(--a);animation:pulse .5s infinite alternate}
.bar{height:16px;border:3px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);transition:width .25s linear}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);min-width:0}
.pick b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{background:var(--b);color:var(--line);transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tr{display:grid;grid-template-columns:40px minmax(0,1fr) 80px 26px;align-items:center;gap:8px;padding:6px;border-radius:14px}
.tr b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr.lead{background:var(--b);color:var(--line)}
.meter{height:12px;background:var(--bg);border:2px solid var(--line);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--a)}
.tr em{font-style:normal;font-weight:900;text-align:right}
.res{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;text-align:center}
.rv{opacity:0;animation:pop .55s cubic-bezier(.3,1.5,.5,1) var(--d,0s) forwards}
.verdict{padding:18px 14px;border:3px solid var(--line);border-radius:24px;font-size:2rem;box-shadow:0 5px 0 var(--line)}
.verdict small{display:block;font:600 1rem Figtree,system-ui,sans-serif;margin-top:6px}
.verdict.win{background:var(--c);color:var(--line)}.verdict.lose{background:var(--a);color:var(--onA)}
footer{text-align:center;font-size:1.2rem;font-weight:800;letter-spacing:.04em;opacity:.95;padding:10px 0 18px}
@media(min-width:700px){body{font-size:19px}.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

const P={click:[[660,.06]],reveal:[[392,.08],[523,.08],[784,.18]],warn:[[880,.09]],vote:[[520,.07],[390,.1]],result:[[330,.12],[330,.12],[494,.25]],win:[[523,.1],[659,.1],[784,.1],[1047,.35]],lose:[[300,.15],[240,.15],[180,.35]]}[t]||[];let T=ac.currentTime;
P.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.18,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.02);T+=d*.9})}catch(e){}}

/* helpers */

const okHint=(h,w,c)=>{h=h.toLowerCase();w=w.toLowerCase();return h.length>1&&!/\s/.test(h)&&!w.includes(h)&&!h.includes(w)&&h!=c.toLowerCase()};

const TI=()=>{const mx=Math.max(...G.tally),lead=[...G.tally.keys()].filter(i=>G.tally[i]==mx);return{mx,lead,tie:lead.length>1}};

/* views */
V.home=()=>`<div class="hero"><div class="faces">${["🦊","🐼","🐸","😈","🐯"].map((e,i)=>`<span class="av" style="--i:${i};background:${AC[(i*2+1)%8]}">${e}</span>`).join("")}</div><h1 class="title disp">IMPOSTER<br>KOHO?</h1><p class="sub">Can you find the Imposter?</p></div>

<p class="note">Hints ${S.hints?"on":"off"} · ${S.timer?S.timer+"s timer":"No timer"} · <button class="link" data-a="go" data-v="settings">Change</button></p>

V.pass=()=>{const p=S.players[G.i];return `${bar("Player "+(G.i+1)+" of "+S.players.length)}<div class="mid"><p class="lab">PASS THE PHONE TO:</p>${avb(p,"xl")}<h2 class="disp name">${esc(p.n)}</h2></div><button class="btn big holdbtn" data-a="revhold" aria-label="Press and hold for 1.5 seconds to reveal"><span>Hold to Reveal 👆</span></button><p class="holdnote">Press and hold for 1.5 seconds to see your role</p>`};

POST.disc=()=>{if(!S.timer||G.done)return;tm=setInterval(()=>{const ms=G.end-Date.now(),l=Math.max(0,Math.ceil(ms/1000)),t=document.getElementById("tm"),b=document.getElementById("bi");if(!t)return;
G.left=l;t.textContent=fmt(l);b.style.width=Math.max(0,ms/(S.timer*10))+"%";

<p class="center">${t.tie?(G.round>1?"Tied again. Nobody is voted out, and the Imposter slips away.":`${names} tied with ${t.mx} votes each. Revote: only they can be picked.`):`${names} got the most votes (${t.mx}).`}</p><div class="grow"></div>

ACT.back=()=>go(st.pop()||"home");
ACT.av=i=>{const p=S.players[i],u=new Set(S.players.map(x=>x.a)),k=AV.indexOf(p.a);for(let j=1;j<=AV.length;j++){const c=AV[(k+j)%AV.length];if(!u.has(c)){p.a=c;break}}save();go("setup",1)};
ACT.add=()=>{if(S.players.length>=16)return;const u=new Set(S.players.map(x=>x.a));S.players.push({n:"Player "+(S.players.length+1),a:shuf(AV.filter(x=>!u.has(x)))[0]});save();go("setup",1);const q=document.querySelectorAll(".prow input"),l=q[q.length-1];l.focus();l.select()};
ACT.rm=i=>{if(S.players.length>3){S.players.splice(+i,1);save();go("setup",1)}};
ACT.all=()=>{S.cats.size==BANK.length?S.cats.clear():BANK.forEach((_,i)=>S.cats.add(i));save();go("setup",1)};
ACT.cat=i=>{i=+i;S.cats.has(i)?S.cats.delete(i):S.cats.add(i);save();go("setup",1)};
ACT.start=()=>{if(!S.cats.size||S.players.length<3)return;S.players.forEach((p,i)=>{p.n=p.n.trim()||"Player "+(i+1)});save();
const pool=[...S.cats].flatMap(i=>BANK[i].w.filter(x=>(EASY_WORDS[BANK[i].n]||[]).includes(x.w)).map(x=>({...x,c:BANK[i].n})));
if(!pool.length)return;let f=pool.filter(x=>!used.has(x.w)&&x.w!==last);if(!f.length){used.clear();f=pool.filter(x=>x.w!==last)}if(!f.length)f=pool;
const x=pick(f);used.add(x.w);last=x.w;const v=x.h.filter(h=>okHint(h,x.w,x.c));
/* Prefer the second association: it is usually less of a giveaway. */
const subtle=v.length>1&&Math.random()<.75?v.slice(1):v;
G={w:x.w,hint:subtle.length?pick(subtle):null,imp:rnd(S.players.length),start:rnd(S.players.length),i:0};go("pass")};
ACT.again=()=>ACT.start();
ACT.rev=()=>{snd("reveal");go("role")};
ACT.reveal=()=>{snd("result");go("result")};
ACT.hide=()=>{G.i++;go(G.i>=S.players.length?"ready":"pass")};
ACT.disc=()=>{G.done=false;G.left=S.timer;G.end=Date.now()+S.timer*1000;G.ls=-1;go("disc")};
function beginVote(){G.vi=0;G.tally=S.players.map(()=>0);G.sel=null;go("vpass")}
ACT.vote=()=>{G.cand=[...S.players.keys()];G.round=1;beginVote()};
ACT.vtap=()=>{G.sel=null;go("vote")};
ACT.pick=i=>{G.sel=+i;go("vote",1)};
ACT.lock=()=>{if(G.sel==null)return;G.tally[G.sel]++;G.sel=null;snd("vote");G.vi++;go(G.vi>=S.players.length?"tally":"vpass")};
ACT.revote=()=>{G.cand=TI().lead;G.round=2;beginVote()};
ACT.result=()=>{const t=TI();G.acc=t.tie?null:t.lead[0];go("result")};
ACT.quit=(v,t)=>{if(t.dataset.arm){go("home")}else{t.dataset.arm=1;t.textContent="Tap again to quit";setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent="✕ Quit"}},2500)}};
ACT.theme=v=>{S.theme=v;applyTheme();save();go("settings",1)};
ACT.tog=k=>{S[k]=!S[k];save();go("settings",1)};
ACT.timer=v=>{S.timer=+v;save();go("settings",1)};
ACT.reset=()=>{S.theme=sysTheme();S.hints=true;S.sound=true;S.timer=60;applyTheme();save();go("settings",1)};

let holdTimer=null,holdTarget=null,holdStarted=false;
function clearHold(){if(holdTimer)clearTimeout(holdTimer);holdTimer=null;if(holdTarget){holdTarget.style.setProperty("--hold-progress","0%");holdTarget.classList.remove("holding")}holdTarget=null;holdStarted=false}
app.addEventListener("pointerdown",e=>{const t=e.target.closest('[data-a="revhold"]');if(!t||t.disabled)return;clearHold();holdTarget=t;holdStarted=false;t.classList.add("holding");t.style.setProperty("--hold-progress","0%");const began=Date.now();holdTimer=setTimeout(()=>{if(!holdTarget||!holdTarget.isConnected)return;holdStarted=true;holdTarget.style.setProperty("--hold-progress","100%");snd("reveal");go("role");holdTarget=null;holdTimer=null},1500);t.setPointerCapture?.(e.pointerId);const tick=()=>{if(!holdTarget||holdStarted)return;holdTarget.style.setProperty("--hold-progress",Math.min(99,(Date.now()-began)/1500*100)+"%");requestAnimationFrame(tick)};requestAnimationFrame(tick)});
app.addEventListener("pointerup",clearHold);
app.addEventListener("pointercancel",clearHold);
app.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;if(t.dataset.a==="revhold"){e.preventDefault();return}const f=ACT[t.dataset.a];if(!f)return;f(t.dataset.v,t);snd("click")});
app.addEventListener("input",e=>{const n=e.target.dataset.n;if(n!=null&&S.players[n]){S.players[n].n=e.target.value;save()}});
go("home");
</script>
</body>
</html>
